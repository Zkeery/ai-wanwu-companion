<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三类动作素材审查</title><style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#edf6f3;color:#243d37;font:16px/1.6 system-ui}main{max-width:1180px;margin:auto}h1{font-size:28px;margin:0 0 8px}.note{background:#fff1cc;padding:12px 18px;border-radius:12px;margin:18px 0}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}article{background:#fff;border-radius:18px;padding:18px;border:1px solid #ccdcd5}h2{margin:0 0 10px;font-size:21px}canvas{width:100%;display:block;background:linear-gradient(135deg,#d8eee6,#f8f4db);border-radius:12px}button{font:inherit;background:#276f62;color:white;border:0;padding:8px 16px;border-radius:9px;cursor:pointer;margin:12px 0}input{width:100%}.caption{font-size:14px;margin:4px 0}summary{cursor:pointer}.atlas{width:100%;background:#e5e9e7;margin-top:16px}.small{color:#49655b;font-size:14px}@media(max-width:700px){body{padding:18px}.cards{grid-template-columns:1fr}h1{font-size:24px}}</style><main><h1>同一伙伴 · 三类动作候选</h1><p>从一张参考原图生成十二个关键姿态，再制成休息、散步和观察三包。</p><div class="note">开发期真实图片编辑样片 · 尚未接入产品自动生成<br>四个关键姿态会有换帧感，正式自然度与图片后10秒门槛仍待验。</div><div class="cards"><article data-activity="rest"><h2>休息</h2><canvas width="360" height="270" aria-label="休息动作预览"></canvas><p class="caption">闭眼与放松</p><button type="button">暂停</button><label>逐帧检查 <span class="frame">0</span> / 15<input type="range" min="0" max="15" value="0" aria-label="休息帧"></label></article><article data-activity="walk"><h2>散步</h2><canvas width="360" height="270" aria-label="散步动作预览"></canvas><p class="caption">交替迈步与重心</p><button type="button">暂停</button><label>逐帧检查 <span class="frame">0</span> / 15<input type="range" min="0" max="15" value="0" aria-label="散步帧"></label></article><article data-activity="observe"><h2>观察</h2><canvas width="360" height="270" aria-label="观察动作预览"></canvas><p class="caption">朝右看与指向</p><button type="button">暂停</button><label>逐帧检查 <span class="frame">0</span> / 15<input type="range" min="0" max="15" value="0" aria-label="观察帧"></label></article></div><p class="small">观察图不虚构目标，实际指向仍需要与场景里的有效物件对齐。此预览不写任务、不调用模型、不绑定真实伙伴。</p><details><summary>查看完整透明总图</summary><img class="atlas" src="apple-atlas-v2.png" alt="四列三行透明姿态总图"></details></main><script>window.players=[];window.previewReady=0;document.querySelectorAll('article').forEach(card=>{const image=new Image();const ctx=card.querySelector('canvas').getContext('2d');const slider=card.querySelector('input');const button=card.querySelector('button');const label=card.querySelector('.frame');const state={id:card.dataset.activity,playing:true,frame:0,started:performance.now()};function draw(n){state.frame=n;ctx.clearRect(0,0,360,270);ctx.drawImage(image,n*360,0,360,270,0,0,360,270);slider.value=n;label.textContent=n;}state.setFrame=n=>{state.playing=false;button.textContent='播放';draw(n);};button.onclick=()=>{state.playing=!state.playing;state.started=performance.now()-state.frame*125;button.textContent=state.playing?'暂停':'播放';};slider.oninput=()=>state.setFrame(Number(slider.value));image.onload=()=>{window.previewReady++;draw(0);};image.src='packs/'+state.id+'/sprite.png';function tick(now){if(state.playing&&image.complete&&image.naturalWidth&&!document.hidden)draw(Math.floor((now-state.started)/125)%16);requestAnimationFrame(tick);}requestAnimationFrame(tick);window.players.push(state);});</script></html>
