<script>
  const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d'),button=document.querySelector('#toggle'),status=document.querySelector('#status');
  const sheet=new Image();let frame=0,ready=false,playing=false,clock=0,raf=null;
  const manifest={width:360,height:270,count:16,fps:8};
  function draw(){ctx.clearRect(0,0,360,270);ctx.drawImage(sheet,frame*360,0,360,270,0,0,360,270);canvas.dataset.frame=String(frame);}
  function labels(){button.textContent=playing?'暂停':'继续播放';status.textContent=playing?'正在散步':'已暂停';}
  function tick(now){if(!playing)return;frame=Math.floor((now-clock)/1000*manifest.fps)%manifest.count;draw();raf=requestAnimationFrame(tick);}
  function setPlaying(next){playing=next;if(raf!==null)cancelAnimationFrame(raf);raf=null;if(playing){clock=performance.now()-frame*1000/manifest.fps;raf=requestAnimationFrame(tick);}labels();}
