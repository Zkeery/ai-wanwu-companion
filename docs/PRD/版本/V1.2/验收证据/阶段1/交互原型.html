const companions={cup:{name:'奶泡小圆',type:'cup',persona:'温柔体贴 · 幽默俏皮',home:'家庭庭院',intro:'把今天的小事，慢慢说给我听吧。',note:'昨天，你们聊起了窗边的新植物。'},plant:{name:'芽芽',type:'plant',persona:'好奇探索 · 行动派',home:'林间营地',intro:'要不要一起发现一件新鲜的小事？',note:'还没有聊天记录。'},fruit:{name:'桃桃',type:'fruit',persona:'慢热内向 · 嘴硬心软',home:null,intro:'我把最柔软的一面，留给你。',note:'还没有聊天记录。'}};
let toastTimer,artCount=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>`<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const button=(text,href,kind='',ico='arrow')=>`<a class="button ${kind}" href="${href}">${ico?icon(ico):''}${text}</a>`;
function art(type='cup'){
 const id='art'+(++artCount);let shape='';
 if(type==='cup')shape=`<path d="M207 107c65-4 62 86 3 79" fill="none" stroke="#fbf4df" stroke-width="22"/><path d="M75 91h136l-9 112q-4 25-59 25t-59-25Z" fill="url(#${id})" stroke="#fcf8ec" stroke-width="4"/><ellipse cx="143" cy="92" rx="69" ry="19" fill="#fff8e9"/><ellipse cx="143" cy="94" rx="57" ry="13" fill="#b68769"/><path d="M123 93q10-12 22 0 16-12 24 0-12 12-24 11-13-4-22-11" fill="#fff2d5"/><path d="M105 74q-8-15 4-27M143 73q-8-15 4-27M177 74q-8-15 4-27" stroke="#fff9" stroke-width="5" fill="none" stroke-linecap="round"/>`;
 if(type==='plant')shape=`<path d="M147 95q-7-44-40-52-17 32 36 54" fill="#68a96f"/><path d="M147 83q24-56 57-43 5 41-53 49" fill="#94c376"/><path d="M149 78v39" stroke="#528d69" stroke-width="9"/><path d="M77 111h135l-17 96q-9 23-51 23t-50-23Z" fill="url(#${id})" stroke="#f4e9db" stroke-width="4"/><rect x="70" y="102" width="149" height="28" rx="12" fill="#dab297"/>`;
 if(type==='fruit')shape=`<path d="M148 83q-8-26 16-40" stroke="#8c7150" stroke-width="9" fill="none"/><path d="M156 76q30-47 61-15-19 30-58 16" fill="#80b877"/><path d="M146 95C82 65 53 131 74 184c20 55 55 36 71 45 23-9 68 11 83-45 14-55-18-119-82-89Z" fill="url(#${id})" stroke="#ffe1cb" stroke-width="3"/>`;
 const colors=type==='cup'?['#fffbe8','#f3d6a8']:type==='plant'?['#f6d5b1','#c49083']:['#ffd9b9','#ed979b'];
 return `<svg class="character-art" viewBox="0 0 300 290" aria-hidden="true"><defs><linearGradient id="${id}" x2=".8" y2="1"><stop stop-color="${colors[0]}"/><stop offset="1" stop-color="${colors[1]}"/></linearGradient></defs><ellipse cx="148" cy="252" rx="74" ry="12" fill="#416e591e"/><g class="body"><ellipse cx="112" cy="237" rx="18" ry="12" fill="${colors[1]}"/><ellipse cx="179" cy="237" rx="18" ry="12" fill="${colors[1]}"/>${shape}<path class="hand" d="M86 173q-36 8-40-8" stroke="${colors[0]}" stroke-width="17" stroke-linecap="round" fill="none"/><path class="hand" d="M208 173q35 10 38-10" stroke="${colors[0]}" stroke-width="17" stroke-linecap="round" fill="none"/><ellipse cx="117" cy="157" rx="8" ry="12" fill="#453648"/><ellipse cx="173" cy="157" rx="8" ry="12" fill="#453648"/><circle cx="119" cy="153" r="3" fill="#fff"/><circle cx="175" cy="153" r="3" fill="#fff"/><ellipse cx="99" cy="176" rx="12" ry="7" fill="#ef999a99"/><ellipse cx="191" cy="176" rx="12" ry="7" fill="#ef999a99"/><path d="M132 181q13 14 26 0" fill="none" stroke="#986c6c" stroke-width="3.5" stroke-linecap="round"/></g></svg>`;
}
function route(){const parts=location.hash.slice(1).split('/');const page=parts[0]||'home';return{page:['home','companion','create','result','discover','theme','team'].includes(page)?page:'home',id:companions[parts[1]]?parts[1]:'cup',tab:['chat','life','profile'].includes(parts[2])?parts[2]:'chat'}};
function toast(text){clearTimeout(toastTimer);document.querySelector('#toast').textContent=text;toastTimer=setTimeout(()=>document.querySelector('#toast').textContent='',4200)}
function hero(id){const c=companions[id],name=esc(state.names[id]);return `<section class="hero-card"><div class="hero-art art-stage"><span class="badge art-label">${icon('heart')}今天，和它待一会儿</span>${art(c.type)}<span class="art-sticker">YOUR<br>LITTLE JOY</span><span class="motion-demo">角色动作示意 · 悬停看看</span></div><div class="hero-info"><span class="eyebrow" style="margin:0">A LITTLE MOMENT TOGETHER</span><h2>${name}</h2><p class="intro">${c.intro}</p><span class="detail-line">${icon('home')}${c.home||'还没有安排住处'}</span><div class="memory-note">${c.note}<small>示例近况 · 正式版只展示已保存的真实记录</small></div><div class="actions">${button('和它聊聊',`#companion/${id}/chat`,'primary','chat')}${button(c.home?'去它的住处':'选择住处',`#companion/${id}/life`,'','home')}</div></div></section>`}
function home(){if(state.view==='guest')return guest();const intro=`<div class="heading"><div><p class="eyebrow">YOUR EVERYDAY, A LITTLE MORE LOVELY</p><h1>今天，也有小小的好事。</h1><p class="lead">看看伙伴的近况，聊会儿天，或一起回家。</p></div><span class="badge">我的小世界 · 示例</span></div>`;
 if(state.view==='empty')return intro+`<section class="panel empty-panel">${icon('leaf')}<h2>第一位伙伴，会是谁呢？</h2><p class="lead">拍下身边的小物，从一张照片开始新的相遇。</p><div class="actions">${button('创造第一位伙伴','#create','primary','plus')}</div></section>`;
 if(state.view==='error')return intro+`<section class="panel empty-panel" role="alert">${icon('heart')}<h2>暂时没能读到伙伴列表</h2><p class="lead">这不代表伙伴丢失了，重新加载试试看。</p><div class="actions"><button class="button primary" data-action="retry">重新加载示例</button></div></section>`;
 if(state.view==='loading')return intro+`<section class="loading-card" role="status" aria-label="正在加载伙伴"><div class="loading-block"></div><div class="loading-block"></div><div class="loading-block" style="width:45%"></div><p class="subtle">正在读取伙伴与近况…</p><button class="text-link" data-action="retry">查看加载完成示例 ${icon('arrow')}</button></section>`;
 return intro+hero('cup')+`<div class="section-title"><h2>还有这些小可爱</h2><span>所有伙伴都在这里 · 3位示例角色</span></div><div class="card-grid">${['plant','fruit'].map(id=>{const c=companions[id];return `<article class="small-card"><div class="small-art art-stage">${art(c.type)}</div><div class="small-info"><h3>${esc(state.names[id])}</h3><p>${c.home||'还没有安排住处'} · ${c.note}</p><div class="actions">${button('聊一会儿',`#companion/${id}/chat`,'','chat')}${button(c.home?'去住处':'选住处',`#companion/${id}/life`,'ghost','home')}</div></div></article>`}).join('')}</div><div class="bottom-note">${icon('spark')}想认识新伙伴？去「创作」；主题与好友活动在「发现」。</div>`;
}
function guest(){return `<section class="guest-layout"><div class="hero-card"><div class="hero-info"><p class="eyebrow">LITTLE THINGS, LOVELY COMPANY</p><h1>拍下日常，<br>遇见独一无二的它。</h1><p>把杯子、植物和喜欢的小物，<br>变成能陪你聊天、一起生活的伙伴。</p><button class="button primary" data-action="login">注册 / 登录 ${icon('arrow')}</button><span class="subtle">从一张照片开始，拥有你的小世界。</span></div><div class="hero-art art-stage">${art('cup')}<span class="art-sticker">一点奇妙<br>一点陪伴</span><span class="motion-demo">形象与动作示意，非生成结果</span></div></div><div class="guest-steps"><span>01 拍下喜欢</span><span>02 认识伙伴</span><span>03 聊天与生活</span></div></section>`}
function companion(id,tab){const c=companions[id];return `<a class="text-link" href="#home">${icon('back')}回到伙伴</a><header class="profile-heading"><div class="profile-avatar art-stage">${art(c.type)}</div><div><p class="eyebrow">YOUR LITTLE COMPANION</p><h1>${esc(state.names[id])}</h1><p class="subtle">${c.persona} · ${c.home||'尚未安排住处'}</p></div></header><div class="local-tabs" role="tablist" aria-label="伙伴功能">${[['chat','聊天'],['life','生活'],['profile','资料']].map(([key,name])=>`<button role="tab" id="tab-${key}" aria-controls="companion-panel" aria-selected="${tab===key}" tabindex="${tab===key?'0':'-1'}" data-tab="${key}" data-id="${id}">${name}</button>`).join('')}</div><section id="companion-panel" role="tabpanel" aria-labelledby="tab-${tab}">${tab==='chat'?chat(id):tab==='life'?life(id):profile(id)}</section>`}
function chat(id){const c=companions[id];return `<div class="companion-layout"><div class="panel chat-panel"><div class="subtle">只属于你和${esc(state.names[id])}的对话 · 当前为示例</div><div class="chat-timeline" aria-label="示例聊天记录"><div class="bubble">${c.intro}</div>${(state.messages[id]||[]).map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.text)}</div>`).join('')}</div><form id="chat-form" data-id="${id}"><label class="input-label" for="draft">想和它说点什么？</label><div class="composer"><textarea id="draft" maxlength="1000" rows="2" placeholder="分享今天的一件小事…" data-draft="${id}">${esc(state.drafts[id]||'')}</textarea><button class="button primary" aria-label="发送演示消息">${icon('arrow')}</button></div><p class="subtle" style="margin-top:8px">只演示交互，不发送给AI；切换分区会保留本页草稿。</p></form></div><aside class="aside-note">${icon('home')}<h3>想一起待一会儿？</h3><p>去生活里看看它的住处。聊天和生活，始终是同一位伙伴。</p><a class="text-link" href="#companion/${id}/life">去${c.home||'选择住处'} ${icon('arrow')}</a></aside></div>`}
function life(id){const c=companions[id];if(!c.home)return `<section class="panel empty-panel">${icon('home')}<h2>给${esc(state.names[id])}选一个住处</h2><p class="lead">家庭庭院、沙漠绿洲，或安静的林间营地。</p><p class="subtle">此处展示尚未入住的引导，不会真的搬家。</p><div class="actions"><button class="button primary" data-action="home-example" data-id="${id}">看看庭院示例</button></div></section>`;
 return `<section class="panel"><div class="heading" style="margin-bottom:0"><div><h2>${c.home}</h2><p class="subtle">${esc(state.names[id])}的私人住处 · 示例场景</p></div><button class="button" data-action="edit-scene">${state.editing?'完成布置示意':'布置'}</button></div><div class="scene-board"><div class="sun"></div><div class="cloud"></div><div class="hill back"></div><div class="hill"></div><svg class="scene-tree" viewBox="0 0 90 180" aria-hidden="true"><path d="M45 150V50" stroke="#8a7854" stroke-width="12" stroke-linecap="round"/><circle cx="45" cy="44" r="34" fill="#71b393"/><circle cx="25" cy="78" r="25" fill="#9bcc9a"/><circle cx="65" cy="78" r="26" fill="#5fa986"/></svg><div class="bench"></div><div class="art-stage">${art(c.type)}</div><span class="scene-caption">保留原住处，安心地生活</span></div>${state.editing?`<div class="editor-tools"><button class="button" data-action="mock-place">${icon('leaf')}种一棵树</button><button class="button" data-action="mock-place">${icon('plus')}摆放装饰</button></div><p class="subtle">这里只预览工具展开方式，不写入真实场景。</p>`:''}<div class="actions">${button('和它说说话',`#companion/${id}/chat`,'primary','chat')}<button class="button" data-action="dance">跳个舞</button></div><p class="subtle layout-note">舞蹈为矢量动作示意；自主生活、四季与共同空间将在对应阶段实现。</p></section>`}
function profile(id){return `<div class="panel"><form id="name-form" class="profile-form" data-id="${id}"><div><label class="input-label" for="name">伙伴的名字</label><input class="field" id="name" value="${esc(state.names[id])}" maxlength="40" required><p class="subtle">1–40字 · 演示修改仅保留在本页</p></div><div><p class="input-label">它的性格</p><div class="tags">${companions[id].persona.split(' · ').map(t=>`<span class="tag">${t}</span>`).join('')}</div><p class="subtle" style="margin-top:9px">预设多选与自定义编辑安排在第2阶段。</p></div><div class="actions"><button class="button primary">保存演示名字</button>${button('回到聊天',`#companion/${id}/chat`,'','chat')}</div></form></div>`}
function create(){return `<div class="heading"><div><p class="eyebrow">A PHOTO. A NEW LITTLE FRIEND.</p><h1>今天，想认识谁？</h1><p class="lead">选一张日常小物的照片，认识它的另一面。</p></div></div><div class="step-row"><span><b>01</b>选择照片</span><span><b>02</b>自动认识它</span><span><b>03</b>第一次见面</span></div><section class="panel upload-grid"><div class="photo-preview">${state.photo?`<img src="${esc(state.photo)}" alt="本地选择的照片预览">`:`${icon('camera')}<p class="subtle">杯子、植物、喜欢的小物…</p>`}</div><div><h2>从身边的小物开始</h2><p class="lead">一张照片，也能开启不同的相遇。</p><label class="input-label" for="photo" style="margin-top:24px">选择照片</label><input type="file" id="photo" accept="image/jpeg,image/png,image/webp"><p class="subtle">JPG / PNG / WebP，≤10MB。仅在浏览器预览。</p><p class="subtle" id="file-status">${esc(state.photoName)}</p><div class="actions" style="margin-top:23px">${button('查看结果示例','#result','primary','spark')}</div><p class="info-pill" style="margin-top:16px">固定示例与所选照片无关，不执行识别或生图，也不代表真实生成耗时。</p></div></section>`}
function result(){return `<a class="text-link" href="#create">${icon('back')}返回创作示意</a><div class="heading"><div><p class="eyebrow">NICE TO MEET YOU</p><h1>你好，我是${esc(state.names.cup)}。</h1><p class="lead">结果页面示例 · 固定角色，非本次上传生成</p></div></div>${hero('cup')}<p class="footnote">生成后的主操作是聊天，住处为次操作；改名与性格等资料管理进入伙伴内部。</p>`}
function discover(){return `<div class="heading"><div><p class="eyebrow">SAME INSPIRATION, DIFFERENT LITTLE SOULS</p><h1>好奇心，在这里相遇。</h1><p class="lead">找一个共同主题，看看不同的想象。</p></div></div><div class="explore-grid"><section class="panel discovery-card"><span class="badge">主题与公开作品</span><h2>同样是一份水果，<br>会遇见怎样的它？</h2><p>大家拍相同的主题，创造各不相同的小生物。</p>${button('看看主题','#theme','primary','spark')}<div class="topic-art">${art('fruit')}</div></section><section class="panel discovery-card"><span class="badge">好友作品小队</span><h2>把新发现，<br>分享给熟悉的人。</h2><p>围绕主题分享作品。私人伙伴与聊天不会自动公开。</p>${button('看看小队入口','#team','','heart')}</section></div><div class="panel" style="margin-top:22px"><h3>从这里出发</h3><div class="guide-row"><b>01</b><div><strong>选一个喜欢的主题</strong><p>从共同灵感开始，创作仍在独立入口里。</p></div></div><div class="guide-row"><b>02</b><div><strong>决定是否分享</strong><p>生成后先成为你的私人伙伴，分享由你确认。</p></div></div></div>`}
function detail(page){const team=page==='team';return `<a class="text-link" href="#discover">${icon('back')}返回发现</a><section class="panel empty-panel">${icon(team?'heart':'spark')}<p class="eyebrow">${team?'FRIENDS & LITTLE CREATIONS':'THE OBJECT · FRUIT'}</p><h1>${team?'好友作品小队':'一份水果，无限种小可爱'}</h1><p class="lead">${team?'这是围绕主题分享作品的入口示意。':'大家拍摄同样的主题，却创造出各不相同的伙伴。'}</p><p class="subtle" style="margin-top:12px">${team?'共同生活与比赛属于后续阶段，本页不冒充它们已经可用。':'主题作品与自由创作分清；正式版分享前需要用户确认。'}</p><div class="actions">${button(team?'查看主题示例':'去创作示意',team?'#theme':'#create','primary','camera')}${button('回到发现','#discover','','back')}</div></section>`}
function render(){const r=route(),group=['discover','theme','team'].includes(r.page)?'discover':['create','result'].includes(r.page)?'create':'home';const guestView=state.view==='guest'&&r.page==='home';document.querySelector('.globalnav').innerHTML=guestView?'':[['home','伙伴','heart'],['create','创作','camera'],['discover','发现','spark']].map(([key,name,ico])=>`<a href="#${key}" ${group===key?'aria-current="page"':''}>${icon(ico)}<span>${name}</span></a>`).join('');document.querySelector('.globalnav').style.display=guestView?'none':'';document.querySelector('#breadcrumb').textContent='我的小世界 / '+({home:'伙伴',create:'创作',discover:'发现'}[group]);document.querySelector('#content').innerHTML=r.page==='home'?home():r.page==='companion'?companion(r.id,r.tab):r.page==='create'?create():r.page==='result'?result():r.page==='discover'?discover():detail(r.page);document.querySelector('#preview-state').value=state.view;}
document.addEventListener('click',e=>{const t=e.target.closest('[data-action],[data-tab]');if(!t)return;if(t.dataset.tab){location.hash=`companion/${t.dataset.id}/${t.dataset.tab}`;return}switch(t.dataset.action){case'retry':state.view='normal';render();break;case'login':document.querySelector('#login-dialog').showModal();break;case'close-login':document.querySelector('#login-dialog').close();break;case'enter-demo':document.querySelector('#login-dialog').close();state.view='normal';render();break;case'edit-scene':state.editing=!state.editing;render();break;case'mock-place':toast('布置入口示意，未修改真实场景。');break;case'home-example':companions[t.dataset.id].home='家庭庭院';render();toast('已进入庭院示例，未执行真实搬家。');break;case'dance':if(matchMedia('(prefers-reduced-motion: reduce)').matches){toast('已遵循系统减少动态效果设置。');break;}document.querySelectorAll('.art-stage').forEach(el=>{el.classList.add('dancing');setTimeout(()=>el.classList.remove('dancing'),3500)});toast('角色本体动作示意，背景保持稳定。');break;}});
document.addEventListener('input',e=>{if(e.target.dataset.draft)state.drafts[e.target.dataset.draft]=e.target.value});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target,id=form.dataset.id;if(form.id==='chat-form'){const text=(state.drafts[id]||'').trim();if(!text)return;state.messages[id]??=[];state.messages[id].push({mine:true,text},{mine:false,text:'我在这里，慢慢听你说。（这是固定示例回复，不是AI生成。）'});state.drafts[id]='';render();document.querySelector('#draft').focus();document.querySelector('.chat-timeline').scrollTop=100000;}if(form.id==='name-form'){const name=document.querySelector('#name').value.trim();if(!name||Array.from(name).length>40){toast('请输入1–40字的名字。');return;}state.names[id]=name;render();toast('演示名字已更新，未修改真实伙伴。');}});
document.querySelector('#preview-state').addEventListener('change',e=>{state.view=e.target.value;if(route().page==='home')render();else location.hash='home'});
document.addEventListener('change',e=>{if(e.target.id!=='photo')return;const file=e.target.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10*1024*1024){e.target.value='';toast('请选择10MB以内的JPG、PNG或WebP照片。');return;}if(state.photo)URL.revokeObjectURL(state.photo);state.photo=URL.createObjectURL(file);state.photoName=file.name;render();});
document.addEventListener('keydown',e=>{if(e.target.getAttribute('role')!=='tab'||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const tabs=['chat','life','profile'],r=route(),index=tabs.indexOf(r.tab),next=e.key==='Home'?0:e.key==='End'?2:(index+(e.key==='ArrowRight'?1:2))%3;location.hash=`companion/${r.id}/${tabs[next]}`;setTimeout(()=>document.querySelector('#tab-'+tabs[next])?.focus(),0)});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});window.addEventListener('pagehide',()=>{if(state.photo)URL.revokeObjectURL(state.photo)});render();
</script>
</body></html>
